<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOC Portal - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #0b1120; 
            color: #f8fafc; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card { 
            background-color: #151f32; 
            border: 1px solid #22324e; 
            border-radius: 14px; 
            width: 100%;
            max-width: 420px;
            padding: 35px 30px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .form-label { 
            font-size: 0.8rem; 
            font-weight: 700; 
            color: #94a3b8; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
        }
        .form-control { 
            background-color: #090e1a !important; 
            border: 1px solid #293854 !important; 
            color: #f8fafc !important; 
            border-radius: 6px; 
            padding: 12px;
        }
        .form-control:focus { 
            background-color: #090e1a !important; 
            border-color: #0284c7 !important; 
            color: #ffffff !important; 
            box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.3) !important; 
        }
        .btn-primary { 
            background-color: #0284c7; 
            border: none; 
            font-weight: 600; 
            padding: 12px; 
            border-radius: 8px; 
            width: 100%;
        }
        .btn-primary:hover { background-color: #0369a1; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="text-center mb-4">
        <h3 class="fw-bold text-white mb-1">NOC Operations</h3>
        <p class="text-secondary small mb-0">Sign in to access Weekly Report Generator</p>
    </div>

    {% if error %}
    <div class="alert alert-danger py-2 text-center small mb-3" role="alert">
        {{ error }}
    </div>
    {% endif %}

    {% if message %}
    <div class="alert alert-info py-2 text-center small mb-3" role="alert">
        {{ message }}
    </div>
    {% endif %}

    <form method="POST" action="/">
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
        </div>
        <div class="mb-4">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-primary shadow">Sign In</button>
    </form>
</div>
</body>
</html>
